<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description }}">
<meta name="color-scheme" content="light dark">
<style>
:root{
  --bg:#ffffff;
  --surface:#f6f7f9;
  --text:#1b1f24;
  --muted:#5b6672;
  --rule:#e2e6ea;
  --accent:#1f6feb;
  --code-bg:#f2f4f6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15181c;
    --surface:#1d2126;
    --text:#e6e9ec;
    --muted:#9aa5b1;
    --rule:#2d333b;
    --accent:#6fb0ff;
    --code-bg:#22272e;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.masthead{
  border-bottom:1px solid var(--rule);
  background:var(--surface);
}
.masthead .inner{
  max-width:46rem;
  margin:0 auto;
  padding:22px 20px 18px;
}
.masthead .app{
  margin:0;
  font-size:1.15rem;
  font-weight:600;
  letter-spacing:-0.01em;
}
.masthead .tag{
  margin:2px 0 0;
  color:var(--muted);
  font-size:.9rem;
}
nav{margin-top:14px}
nav a{
  display:inline-block;
  margin-right:18px;
  color:var(--muted);
  text-decoration:none;
  font-size:.92rem;
}
nav a:hover{color:var(--accent)}
nav a.here{color:var(--text);font-weight:600}
main{
  max-width:46rem;
  margin:0 auto;
  padding:36px 20px 8px;
}
h1{font-size:1.85rem;line-height:1.25;letter-spacing:-0.02em;margin:0 0 .6em}
h2{font-size:1.3rem;margin:2.2em 0 .5em;letter-spacing:-0.01em}
h3{font-size:1.05rem;margin:1.9em 0 .4em}
p,li{overflow-wrap:break-word}
a{color:var(--accent)}
hr{border:0;border-top:1px solid var(--rule);margin:2.4em 0}
strong{font-weight:600}
code{
  background:var(--code-bg);
  padding:.15em .35em;
  border-radius:4px;
  font-size:.9em;
}
table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:.94rem}
th,td{border:1px solid var(--rule);padding:8px 10px;text-align:left}
th{background:var(--surface);font-weight:600}
blockquote{
  margin:1.2em 0;
  padding:.1em 0 .1em 1em;
  border-left:3px solid var(--rule);
  color:var(--muted);
}
footer{
  max-width:46rem;
  margin:0 auto;
  padding:28px 20px 56px;
  border-top:1px solid var(--rule);
  color:var(--muted);
  font-size:.88rem;
}
footer a{color:var(--muted)}
footer p{margin:.35em 0}
@media (max-width:480px){
  main{padding-top:28px}
  h1{font-size:1.55rem}
  nav a{margin-right:14px}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="inner">
    <p class="app">Deed to Map</p>
    <p class="tag">Metes &amp; Bounds</p>
    <nav>
      <a href="{{ site.baseurl }}/"{% if page.url == "/" %} class="here"{% endif %}>Support</a>
      <a href="{{ site.baseurl }}/privacy"{% if page.url contains "privacy" %} class="here"{% endif %}>Privacy</a>
      <a href="{{ site.baseurl }}/terms"{% if page.url contains "terms" %} class="here"{% endif %}>Terms</a>
    </nav>
  </div>
</header>

<main>
{{ content }}
</main>

<footer>
  <p>Deed to Map: Metes &amp; Bounds</p>
  <p><a href="mailto:developer.barseghyan@gmail.com">developer.barseghyan@gmail.com</a></p>
  <p>&copy; {{ site.time | date: "%Y" }} Tigran Barseghyan</p>
</footer>

</body>
</html>
